<div class="flex flex-wrap gap-3 items-start bg-base-200/50 rounded-box p-3" data-formset-row data-has-pk="{% if form.instance.pk %}true{% else %}false{% endif %}">
  {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}

  {% for field in form.visible_fields %}
    {% if field.name != 'DELETE' %}
    <div class="form-control flex-1 min-w-[180px]">
      <label class="label py-1" for="{{ field.id_for_label }}">
        <span class="label-text text-xs">{{ field.label }}</span>
      </label>
      {{ field }}
      {% if field.errors %}
        <span class="label-text-alt text-error text-xs">{{ field.errors|striptags }}</span>
      {% endif %}
    </div>
    {% else %}
      <span class="hidden">{{ field }}</span>
    {% endif %}
  {% endfor %}

  <div class="flex items-center pt-6">
    <button
      type="button"
      class="btn btn-ghost btn-square btn-sm text-error"
      onclick="eliminarFilaFormset(this)"
      title="Quitar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round"
          stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="size-4">
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
    </button>
  </div>
</div>
